services:
  chatbe:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "5001:5001"
    depends_on:
      - db
      - redis
  db:
    image: mongo
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  redis:
    image: redis
    container_name: worker
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
volumes:
  mongo-data:
  redis-data:
